<div class="card">
  <div class="card__header">
    <h1>Wprowadź dane</h1>
    <p class="text">Wprowadź dane dla postaci {{ typeForm() }}</p>
    <div class="functionPattern">{{ pattern() }}</div>
  </div>
  <div class="card__fields">
    <label>
      {{ firstLabel()
      }}<input type="number" name="" placeholder="{{ firstPlaceholder() }}" /></label
    ><label
      >{{ secondLabel()
      }}<input type="number" name="" placeholder="{{ secondPlaceholder() }}" /></label
    ><label>
      {{ thirdLabel() }}<input type="number" name="" placeholder="{{ thirdPlaceholder() }}"
    /></label>
  </div>
  <button class="mainLink">Oblicz</button>
  <div class="card__footer">
    <ng-icon name="lucideLightbulb" size="24px" />
    <div class="card__tip">
      <p><strong>Porada</strong></p>
      <p>
       {{hint()}}
      </p>
    </div>
  </div>
</div>
